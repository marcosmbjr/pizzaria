<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria JS</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/samples.css">
    <!-- Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- OU -->
    <script src="https://kit.fontawesome.com/ab63973773.js" crossorigin="anonymous" defer></script>

</head>

<body>
    <!-- block__element--modifier  -->
    <header class="header">
        <!-- LOGOTIPO  -->
        <img src="./image/logo.png" alt="Logotipo Juquinha Pizzas" class="header__logo">
        <!-- TÍTULO -->
        <h1 class="header__title">Juquinha Pizzas -
            <span class="header__title--blue">Menu</span>
        </h1>
    </header>
    <main>
        <form class="form" action="#">
            <span>Login</span>
            <input class="form__input" type="email" name="" id="login" placeholder="Login" required>
            <input class="form__input" type="password" name="" id="senha" placeholder="Senha" required
            maxlength="8">
            <div class="form__btn-area">
                <input class="form__btn" type="button" value="Registrar">
                <input class="form__btn form__btn--action" type="submit" value="Login">
            </div>
        </form>
    </main>
    <footer class="footer">
        <address class="footer__columns footer__address">
            Endereço: Rua das Margaridas, 25 Centro São Paulo SP
        </address>
        <section class="footer__columns footer__social">
            <p class="footer__social-text">Siga nos nas redes sociais</p>
            <div class="footer__social-icons">
                <a href="#"><i class="footer__social-icon fa-brands fa-facebook"></i></a>
                <a href="#"><i class="footer__social-icon fa-brands fa-whatsapp"></i></a>
                <a href="#"><i class="footer__social-icon fa-brands fa-instagram"></i></a>
            </div>
        </section>
        <div class="footer__columns footer__devby">
            Desenvolvido por XYZ - Soluções Digitais
        </div>
    </footer>
</body>

</html>
